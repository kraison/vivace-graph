<?xml version="1.0" encoding="UTF-8"?>
<svg width="1240" height="898" viewBox="0 0 1240 898" role="img" aria-label="the commit path of with-transaction in order, banded by whether the transaction-manager lock is held, with the retry loop and the side effects" xmlns="http://www.w3.org/2000/svg"><style>
:root { --paper:#e9ecee; --surface:#f7f9fa; --sunk:#dfe4e7; --ink:#131b21; --muted:#56666f; --line:#79868e; --live:#0f6d63; --open:#8a5a00; --halt:#a02c26; --virt:#56399c;
  --face-text: Charter, "Iowan Old Style", "Charis SIL", Cambria, Georgia,
    "Times New Roman", serif;
  --face-data: ui-monospace, "DejaVu Sans Mono", "Liberation Mono", Menlo,
    Consolas, monospace; }
@media (prefers-color-scheme: dark) {
  :root { --paper:#0f1518; --surface:#172025; --sunk:#0a0f11; --ink:#e4eaed; --muted:#93a4ad; --line:#5d6a72; --live:#52c2b1; --open:#dda63f; --halt:#f2756c; --virt:#b49ae9; } }
.bg { fill: var(--surface); }
text { font-family: var(--face-text); }
.nd { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.nd.live { stroke: var(--live); stroke-width: 1.8; }
.nd.virt { stroke: var(--virt); stroke-width: 1.8; }
.nd.halt { stroke: var(--halt); stroke-width: 1.8; }
.nd.open { stroke: var(--open); stroke-width: 1.8; }
.nd.store { stroke: var(--ink); stroke-width: 2.6; }
.nd.sub { stroke-dasharray: 5 3; }
.nd.note { fill: none; stroke-dasharray: 2 3; }
.rg { fill: none; stroke: var(--line); stroke-width: 1.2;
  stroke-dasharray: 8 6; }
.hostbox { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.rt, .t1, .tm, .tms, .tk, .tag, .grp, .rn, .bt {
  font-family: var(--face-data); }
.rt { font-size: 11px; letter-spacing: 0.08em; fill: var(--muted); }
.t1 { font-size: 13px; font-weight: 700; fill: var(--ink); }
.t2 { font-size: 12px; fill: var(--muted); }
.t3 { font-size: 11px; fill: var(--muted); }
.tm { font-size: 11.5px; fill: var(--ink); }
.tms { font-size: 11.5px; font-weight: 700; fill: var(--ink); }
.tk { font-size: 11px; fill: var(--muted); }
.tby { font-size: 11px; font-style: italic; fill: var(--muted); }
.tag { font-size: 9.5px; letter-spacing: 0.1em; fill: var(--muted); }
.grp { font-size: 10.5px; letter-spacing: 0.1em; fill: var(--muted); }
.rn { font-size: 12px; fill: var(--ink); }
.rr { font-size: 11.5px; fill: var(--muted); }
.zebra { fill: var(--paper); opacity: 0.6; }
.badge { fill: var(--sunk); stroke: var(--line); stroke-width: 0.8; }
.bt { font-size: 10px; font-weight: 700; fill: var(--ink); }
.div { stroke: var(--sunk); stroke-width: 1; }
.dot { fill: var(--ink); }
.ed { fill: none; stroke: var(--ink); stroke-width: 1.3; }
.ed.soft { stroke-dasharray: 5 4; }
.ed.halt { stroke: var(--halt); stroke-width: 2; }
.ed.mut { stroke: var(--line); stroke-dasharray: 2 3; }
.halo { fill: none; stroke: var(--surface); stroke-width: 8; }
.lb { font-size: 11.5px; fill: var(--muted); paint-order: stroke;
  stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.lb.halt { fill: var(--halt); }
.ah { fill: var(--ink); }
.ah-h { fill: var(--halt); }
.ah-m { fill: var(--line); }
</style><rect width="100%" height="100%" class="bg"/><defs><marker id="f6-a" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah"/></marker><marker id="f6-h" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah-h"/></marker><marker id="f6-m" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah-m"/></marker></defs><rect x="70" y="685" width="560" height="141" rx="6" class="nd"/><rect x="70" y="307" width="560" height="366" rx="6" class="nd live"/><rect x="70" y="40" width="560" height="255" rx="6" class="nd"/><text x="82" y="80" class="tms" text-anchor="start">with-transaction</text><text x="210" y="80" class="rr" text-anchor="start">call-with-transaction binds *transaction*</text><text x="82" y="107" class="tms" text-anchor="start">create-transaction</text><text x="210" y="107" class="rr" text-anchor="start">the TM lock, briefly: the accepting-p gate;</text><text x="210" y="122" class="rr" text-anchor="start">start-tx-id = the current epoch; a sequence</text><text x="210" y="137" class="rr" text-anchor="start">number; registered :active in the TM table</text><text x="82" y="164" class="tms" text-anchor="start">the body</text><text x="210" y="164" class="rr" text-anchor="start">lookup-object: own writes first, then the version</text><text x="210" y="179" class="rr" text-anchor="start">visible at start-tx-id (resolve-version-at-epoch);</text><text x="210" y="194" class="rr" text-anchor="start">read-set by node id, unless *record-reads* is nil</text><text x="82" y="221" class="tms" text-anchor="start">writes</text><text x="210" y="221" class="rr" text-anchor="start">creates to create-set; updates and deletes to</text><text x="210" y="236" class="rr" text-anchor="start">write-set; nothing touches the store yet</text><text x="82" y="263" class="tms" text-anchor="start">%commit: prepare</text><text x="210" y="263" class="rr" text-anchor="start">state :committing; prepare-tx-persistence</text><text x="210" y="278" class="rr" text-anchor="start">serializes to tx/prep-&lt;seq&gt;.txn-tmp, id 0</text><text x="82" y="347" class="tms" text-anchor="start">finish-tx-id</text><text x="210" y="347" class="rr" text-anchor="start">= the current epoch</text><text x="82" y="374" class="tms" text-anchor="start">validate</text><text x="210" y="374" class="rr" text-anchor="start">an empty write-set passes; else every committed</text><text x="210" y="389" class="rr" text-anchor="start">tx between start and finish: a write/write or</text><text x="210" y="404" class="rr" text-anchor="start">read/write overlap signals validation-conflict</text><text x="82" y="431" class="tms" text-anchor="start">validators</text><text x="210" y="431" class="rr" text-anchor="start">validate-live-heads; *commit-validators* with</text><text x="210" y="446" class="rr" text-anchor="start">*read-own-writes* nil; vector-segment checks</text><text x="82" y="473" class="tms" text-anchor="start">the epoch</text><text x="210" y="473" class="rr" text-anchor="start">transaction-id = tm-next-epoch: the shadow lease,</text><text x="210" y="488" class="rr" text-anchor="start">else the system clock, else the store&#x27;s counter</text><text x="82" y="515" class="tms" text-anchor="start">prune</text><text x="210" y="515" class="rr" text-anchor="start">prune-committed-transactions keeps what a</text><text x="210" y="530" class="rr" text-anchor="start">:committing transaction still needs</text><text x="82" y="557" class="tms" text-anchor="start">finalize</text><text x="210" y="557" class="rr" text-anchor="start">rename to tx/&lt;hex id&gt;.txn: the durability point;</text><text x="210" y="572" class="rr" text-anchor="start">masters and peers append replication-&lt;id&gt;.log</text><text x="82" y="599" class="tms" text-anchor="start">apply</text><text x="210" y="599" class="rr" text-anchor="start">*commit-epoch*; archive the old head on prev-pointer;</text><text x="210" y="614" class="rr" text-anchor="start">cache; views; spatial; vectors; unique, secondary</text><text x="210" y="629" class="rr" text-anchor="start">and count indexes; reap-old-versions; watermark</text><text x="82" y="656" class="tms" text-anchor="start">broadcast</text><text x="210" y="656" class="rr" text-anchor="start">a master: the tx into each slave session&#x27;s mailbox</text><text x="82" y="725" class="tms" text-anchor="start">committed</text><text x="210" y="725" class="rr" text-anchor="start">state :committed; patch the .txn header id</text><text x="82" y="752" class="tms" text-anchor="start">cleanup</text><text x="210" y="752" class="rr" text-anchor="start">delete the .txn, or rename it .committed; the tx</text><text x="210" y="767" class="rr" text-anchor="start">stays in the TM table for OCC until pruned</text><text x="82" y="794" class="tms" text-anchor="start">hooks</text><text x="210" y="794" class="rr" text-anchor="start">*after-commit-hooks* on this thread, no lock:</text><text x="210" y="809" class="rr" text-anchor="start">the forward-rules drain</text><text x="82" y="56" class="grp" text-anchor="start">OFF THE LOCK</text><text x="82" y="323" class="grp" text-anchor="start">UNDER THE TM LOCK  (a recursive mutex, one per store)</text><text x="82" y="701" class="grp" text-anchor="start">AFTER</text><path d="M70,386.5 L44,386.5 L44,176.5 L70,176.5" class="ed" marker-end="url(#f6-a)"/><text x="38" y="283.0" class="lb" text-anchor="middle" transform="rotate(-90 38 283.0)">validation-conflict: retry</text><path d="M680,387 L680,469 A110.0,7 0 0 0 900,469 L900,387" class="nd store"/><ellipse cx="790.0" cy="387" rx="110.0" ry="7" class="nd store"/><text x="690" y="410" class="t1" text-anchor="start">tx/</text><text x="690" y="427" class="t2" text-anchor="start">prep-&lt;seq&gt;.txn-tmp, then</text><text x="690" y="442" class="t2" text-anchor="start">&lt;hex id&gt;.txn; replication-&lt;id&gt;.log</text><text x="690" y="457" class="t2" text-anchor="start">for masters and peers</text><path d="M680,567 L680,643 A110.0,7 0 0 0 900,643 L900,567" class="nd store"/><ellipse cx="790.0" cy="567" rx="110.0" ry="7" class="nd store"/><text x="690" y="590" class="t1" text-anchor="start">heap.dat</text><text x="690" y="607" class="t2" text-anchor="start">the archived head and its</text><text x="690" y="622" class="t2" text-anchor="start">prev-pointer; the new data;</text><text x="690" y="637" class="t2" text-anchor="start">reaped chains cut</text><rect x="680" y="690" width="220" height="108" rx="6" class="nd live"/><text x="690" y="710" class="t1" text-anchor="start">slave sessions · forward timer</text><text x="690" y="727" class="t2" text-anchor="start">the broadcast fills each session&#x27;s</text><text x="690" y="742" class="t2" text-anchor="start">mailbox while the lock is held; the</text><text x="690" y="757" class="t2" text-anchor="start">hooks drain the forward queue on</text><text x="690" y="772" class="t2" text-anchor="start">this thread, or schedule a timer</text><text x="690" y="787" class="t2" text-anchor="start">(figure 5)</text><path d="M630,259 L655,259 L655,410 L680,410" class="ed" marker-end="url(#f6-a)"/><text x="649" y="253" class="lb" text-anchor="end">write</text><path d="M630,553 L655,553 L655,450 L680,450" class="ed" marker-end="url(#f6-a)"/><text x="649" y="547" class="lb" text-anchor="end">rename</text><path d="M630,597 L680,597" class="ed" marker-end="url(#f6-a)"/><text x="655" y="591" class="lb" text-anchor="middle">write</text><path d="M630,652 L655,652 L655,712 L680,712" class="ed" marker-end="url(#f6-a)"/><text x="649" y="646" class="lb" text-anchor="end">mailbox</text><path d="M630,790 L655,790 L655,780 L680,780" class="ed" marker-end="url(#f6-a)"/><text x="649" y="784" class="lb" text-anchor="end">drain</text><rect x="940" y="40" width="276" height="124" rx="6" class="nd"/><text x="950" y="60" class="t1" text-anchor="start">the retry and the fallback</text><text x="950" y="77" class="t2" text-anchor="start">each validation-conflict runs the body</text><text x="950" y="92" class="t2" text-anchor="start">again; at *maximum-transaction-attempts*</text><text x="950" y="107" class="t2" text-anchor="start">(8) it runs once more under the TM lock</text><text x="950" y="122" class="t2" text-anchor="start">with no handler: nothing can conflict,</text><text x="950" y="137" class="t2" text-anchor="start">and nothing else can start meanwhile</text><text x="950" y="152" class="t2" text-anchor="start">any other error propagates at once</text><rect x="940" y="200" width="276" height="214" rx="6" class="nd"/><text x="950" y="220" class="t1" text-anchor="start">a read at an epoch (with-as-of)</text><text x="950" y="237" class="t2" text-anchor="start">create-transaction :start-epoch as-of+1,</text><text x="950" y="252" class="t2" text-anchor="start">class as-of-tx, read-only; a pin at the</text><text x="950" y="267" class="t2" text-anchor="start">current epoch holds the reaper floor</text><text x="950" y="282" class="t2" text-anchor="start">each read: the live head if its commit-</text><text x="950" y="297" class="t2" text-anchor="start">epoch &lt; epoch, else the first archived</text><text x="950" y="312" class="t2" text-anchor="start">head older than it, along prev-pointer;</text><text x="950" y="327" class="t2" text-anchor="start">a chain that runs out is absent (revision</text><text x="950" y="342" class="t2" text-anchor="start">0) or reaped: :if-reaped :skip or :error</text><text x="950" y="357" class="t2" text-anchor="start">refused: :no-version-history, :future-</text><text x="950" y="372" class="t2" text-anchor="start">epoch, :read-write-transaction,</text><text x="950" y="387" class="t2" text-anchor="start">:untyped-scan. Never validated; unpinned</text><text x="950" y="402" class="t2" text-anchor="start">on exit</text><rect x="940" y="450" width="276" height="94" rx="6" class="nd"/><text x="950" y="470" class="t1" text-anchor="start">recovery at open</text><text x="950" y="487" class="t2" text-anchor="start">recover-transactions replays the</text><text x="950" y="502" class="t2" text-anchor="start">tx/*.txn left behind, in hex order,</text><text x="950" y="517" class="t2" text-anchor="start">with no locking, before the store is</text><text x="950" y="532" class="t2" text-anchor="start">handed out</text><rect x="940" y="580" width="276" height="94" rx="6" class="nd"/><text x="950" y="600" class="t1" text-anchor="start">a slave or a device</text><text x="950" y="617" class="t2" text-anchor="start">skips the teal band: a replicated</text><text x="950" y="632" class="t2" text-anchor="start">transaction has a no-op lock and no</text><text x="950" y="647" class="t2" text-anchor="start">validation; the device&#x27;s writer is the</text><text x="950" y="662" class="t2" text-anchor="start">store&#x27;s only writer</text><text x="24" y="866" class="t3" text-anchor="start">The teal band is held under the transaction-manager lock; everything else runs on the committing thread without it. A read-only with-transaction takes the same path:</text><text x="24" y="880" class="t3" text-anchor="start">it writes and renames a .txn, takes the lock and consumes an epoch.</text></svg>
