<?xml version="1.0" encoding="UTF-8"?>
<svg width="1240" height="770" viewBox="0 0 1240 770" role="img" aria-label="the spacetime claim model: a claim family&#x27;s slots and keys, its endpoints, the rules schema and the derivation and firing records that name claims by identity key" xmlns="http://www.w3.org/2000/svg"><style>
:root { --paper:#e9ecee; --surface:#f7f9fa; --sunk:#dfe4e7; --ink:#131b21; --muted:#56666f; --line:#79868e; --live:#0f6d63; --open:#8a5a00; --halt:#a02c26; --virt:#56399c;
  --face-text: Charter, "Iowan Old Style", "Charis SIL", Cambria, Georgia,
    "Times New Roman", serif;
  --face-data: ui-monospace, "DejaVu Sans Mono", "Liberation Mono", Menlo,
    Consolas, monospace; }
@media (prefers-color-scheme: dark) {
  :root { --paper:#0f1518; --surface:#172025; --sunk:#0a0f11; --ink:#e4eaed; --muted:#93a4ad; --line:#5d6a72; --live:#52c2b1; --open:#dda63f; --halt:#f2756c; --virt:#b49ae9; } }
.bg { fill: var(--surface); }
text { font-family: var(--face-text); }
.nd { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.nd.live { stroke: var(--live); stroke-width: 1.8; }
.nd.virt { stroke: var(--virt); stroke-width: 1.8; }
.nd.halt { stroke: var(--halt); stroke-width: 1.8; }
.nd.open { stroke: var(--open); stroke-width: 1.8; }
.nd.store { stroke: var(--ink); stroke-width: 2.6; }
.nd.sub { stroke-dasharray: 5 3; }
.nd.note { fill: none; stroke-dasharray: 2 3; }
.rg { fill: none; stroke: var(--line); stroke-width: 1.2;
  stroke-dasharray: 8 6; }
.hostbox { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.rt, .t1, .tm, .tms, .tk, .tag, .grp, .rn, .bt {
  font-family: var(--face-data); }
.rt { font-size: 11px; letter-spacing: 0.08em; fill: var(--muted); }
.t1 { font-size: 13px; font-weight: 700; fill: var(--ink); }
.t2 { font-size: 12px; fill: var(--muted); }
.t3 { font-size: 11px; fill: var(--muted); }
.tm { font-size: 11.5px; fill: var(--ink); }
.tms { font-size: 11.5px; font-weight: 700; fill: var(--ink); }
.tk { font-size: 11px; fill: var(--muted); }
.tby { font-size: 11px; font-style: italic; fill: var(--muted); }
.tag { font-size: 9.5px; letter-spacing: 0.1em; fill: var(--muted); }
.grp { font-size: 10.5px; letter-spacing: 0.1em; fill: var(--muted); }
.rn { font-size: 12px; fill: var(--ink); }
.rr { font-size: 11.5px; fill: var(--muted); }
.zebra { fill: var(--paper); opacity: 0.6; }
.badge { fill: var(--sunk); stroke: var(--line); stroke-width: 0.8; }
.bt { font-size: 10px; font-weight: 700; fill: var(--ink); }
.div { stroke: var(--sunk); stroke-width: 1; }
.dot { fill: var(--ink); }
.ed { fill: none; stroke: var(--ink); stroke-width: 1.3; }
.ed.soft { stroke-dasharray: 5 4; }
.ed.halt { stroke: var(--halt); stroke-width: 2; }
.ed.mut { stroke: var(--line); stroke-dasharray: 2 3; }
.halo { fill: none; stroke: var(--surface); stroke-width: 8; }
.lb { font-size: 11.5px; fill: var(--muted); paint-order: stroke;
  stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.lb.halt { fill: var(--halt); }
.ah { fill: var(--ink); }
.ah-h { fill: var(--halt); }
.ah-m { fill: var(--line); }
</style><rect width="100%" height="100%" class="bg"/><defs><marker id="f4-a" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah"/></marker><marker id="f4-h" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah-h"/></marker><marker id="f4-m" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah-m"/></marker></defs><rect x="24" y="40" width="230" height="134" rx="6" class="nd"/><text x="34" y="54" class="tag" text-anchor="start">RULES SCHEMA</text><text x="34" y="70" class="t1" text-anchor="start">rule  (def-source)</text><text x="34" y="85" class="tk" text-anchor="start">key name · namespace :rule</text><line x1="24" y1="92" x2="254" y2="92" class="div"/><text x="34" y="106" class="tm" text-anchor="start">version · enabled</text><text x="34" y="121" class="tm" text-anchor="start">family: a claim class name</text><text x="34" y="136" class="tm" text-anchor="start">head · body</text><text x="34" y="151" class="tm" text-anchor="start">extent-policy :premises|:none</text><text x="34" y="166" class="tby" text-anchor="start">by def-rule, retire-rule</text><rect x="24" y="530" width="230" height="119" rx="6" class="nd"/><text x="34" y="544" class="tag" text-anchor="start">RULES SCHEMA</text><text x="34" y="560" class="t1" text-anchor="start">production (def-source)</text><text x="34" y="575" class="tk" text-anchor="start">key name · namespace :production</text><line x1="24" y1="582" x2="254" y2="582" class="div"/><text x="34" y="596" class="tm" text-anchor="start">version · family</text><text x="34" y="611" class="tm" text-anchor="start">body · salience</text><text x="34" y="626" class="tm" text-anchor="start">writes · action</text><text x="34" y="641" class="tby" text-anchor="start">by def-production</text><rect x="330" y="60" width="350" height="209" rx="6" class="nd"/><text x="340" y="74" class="tag" text-anchor="start">CLAIM FAMILY · def-claim-classes</text><text x="340" y="90" class="t1" text-anchor="start">&lt;parent&gt;  unary | binary</text><text x="340" y="105" class="tk" text-anchor="start">key producer · subject · relation (+ object)</text><line x1="330" y1="112" x2="680" y2="112" class="div"/><text x="340" y="126" class="tm" text-anchor="start">subject-namespace · subject-key ⇢ source</text><text x="340" y="141" class="tm" text-anchor="start">relation</text><text x="340" y="156" class="tm" text-anchor="start">object-ns · object-key ⇢ source  (binary)</text><text x="340" y="171" class="tm" text-anchor="start">producer ⇢ rule/NAME | production/NAME</text><text x="340" y="186" class="tm" text-anchor="start">rule-version · method · standing</text><text x="340" y="201" class="tm" text-anchor="start">confidence · fraction · geometry · precision-m</text><text x="340" y="216" class="tm" text-anchor="start">extent-sexp  (validity time)</text><text x="340" y="231" class="tm" text-anchor="start">transaction-extent-sexp  (record time)</text><text x="340" y="246" class="tm" text-anchor="start">version-stamp  (re-stamped on every save)</text><text x="340" y="261" class="tby" text-anchor="start">by callers, register-node, the rules</text><rect x="960" y="60" width="256" height="119" rx="6" class="nd"/><text x="970" y="74" class="tag" text-anchor="start">ENDPOINT · def-source</text><text x="970" y="90" class="t1" text-anchor="start">&lt;class&gt;  (def-vertex)</text><text x="970" y="105" class="tk" text-anchor="start">key key-slot (def-unique)</text><line x1="960" y1="112" x2="1216" y2="112" class="div"/><text x="970" y="126" class="tm" text-anchor="start">namespace: a keyword</text><text x="970" y="141" class="tm" text-anchor="start">its own slots</text><text x="970" y="156" class="tm" text-anchor="start">registration facet (optional)</text><text x="970" y="171" class="tby" text-anchor="start">by callers</text><rect x="720" y="230" width="210" height="96" rx="6" class="nd"/><text x="730" y="250" class="t1" text-anchor="start">subject-of · object-of</text><text x="730" y="267" class="t2" text-anchor="start">def-edge, no slots: claim to endpoint</text><text x="730" y="282" class="t2" text-anchor="start">an optional cache, made only for an</text><text x="730" y="297" class="t2" text-anchor="start">unambiguous same-store match, or</text><text x="730" y="312" class="t2" text-anchor="start">deferred (*link-claims-at-write*)</text><rect x="330" y="330" width="350" height="164" rx="6" class="nd"/><text x="340" y="344" class="tag" text-anchor="start">CLAIM FAMILY · derivation</text><text x="340" y="360" class="t1" text-anchor="start">derivation  (binary claim)</text><text x="340" y="375" class="tk" text-anchor="start">key rule/NAME · subject · relation · object</text><line x1="330" y1="382" x2="680" y2="382" class="div"/><text x="340" y="396" class="tm" text-anchor="start">subject (:claim . derived identity key) ⇢</text><text x="340" y="411" class="tm" text-anchor="start">relation &quot;derived-from&quot;</text><text x="340" y="426" class="tm" text-anchor="start">object (:claim . premise identity key) ⇢</text><text x="340" y="441" class="tm" text-anchor="start">producer rule/NAME ⇢ rule</text><text x="340" y="456" class="tm" text-anchor="start">method: the premise&#x27;s store (nil: own)</text><text x="340" y="471" class="tm" text-anchor="start">standing :inferred · no extent</text><text x="340" y="486" class="tby" text-anchor="start">by run-rules, forward steps</text><rect x="330" y="570" width="350" height="134" rx="6" class="nd"/><text x="340" y="584" class="tag" text-anchor="start">CLAIM FAMILY · firing</text><text x="340" y="600" class="t1" text-anchor="start">firing  (binary claim)</text><text x="340" y="615" class="tk" text-anchor="start">key production/NAME · subject · relation · object</text><line x1="330" y1="622" x2="680" y2="622" class="div"/><text x="340" y="636" class="tm" text-anchor="start">subject (:production . FNV-1a hash)</text><text x="340" y="651" class="tm" text-anchor="start">relation = the production&#x27;s name ⇢</text><text x="340" y="666" class="tm" text-anchor="start">object (:instantiation . premise keys) ⇢</text><text x="340" y="681" class="tm" text-anchor="start">standing :inferred</text><text x="340" y="696" class="tby" text-anchor="start">by run-agenda</text><rect x="720" y="370" width="210" height="170" rx="6" class="nd"/><text x="730" y="390" class="t1" text-anchor="start">indexes on the family</text><text x="730" y="407" class="t2" text-anchor="start">claim-subject · claim-object</text><text x="730" y="422" class="t2" text-anchor="start">claim-producer · claim-relation</text><text x="730" y="437" class="t2" text-anchor="start">claim-subject-relation</text><text x="730" y="452" class="t2" text-anchor="start">claim-touched-at  (the change feed)</text><text x="730" y="467" class="t2" text-anchor="start">claim-validity  (current, end)</text><text x="730" y="482" class="t2" text-anchor="start">counts: subject, object, relation</text><text x="730" y="497" class="t2" text-anchor="start">in indexes.dat; roots in sidecars</text><rect x="960" y="370" width="256" height="170" rx="6" class="nd note"/><text x="970" y="390" class="t1" text-anchor="start">image-only, never persisted</text><text x="970" y="407" class="t2" text-anchor="start">claim families · source contracts</text><text x="970" y="422" class="t2" text-anchor="start">namespace → source class</text><text x="970" y="437" class="t2" text-anchor="start">membership disjointness specs</text><text x="970" y="452" class="t2" text-anchor="start">rule and production specs</text><text x="970" y="467" class="t2" text-anchor="start">compiled rules · forward state</text><text x="970" y="482" class="t2" text-anchor="start">the compiled-query cache</text><path d="M680,122 L960,122" class="ed soft" marker-end="url(#f4-a)"/><text x="820" y="116" class="lb" text-anchor="middle">by (namespace, key), via the key-slot index</text><path d="M680,152 L960,152" class="ed soft" marker-end="url(#f4-a)"/><path d="M680,250 L720,250" class="ed" marker-end="url(#f4-a)"/><text x="700" y="244" class="lb" text-anchor="middle">from</text><path d="M930,250 L1088,250 L1088,179" class="ed" marker-end="url(#f4-a)"/><text x="1010" y="244" class="lb" text-anchor="middle">to: the endpoint&#x27;s id</text><path d="M330,167 L254,167" class="ed soft" marker-end="url(#f4-a)"/><text x="292" y="147" class="lb" text-anchor="middle">rule/NAME</text><text x="292" y="161" class="lb" text-anchor="middle">rule-version</text><path d="M330,437 L134,437 L134,174" class="ed soft" marker-end="url(#f4-a)"/><path d="M330,392 L306,392 L306,250 L330,250" class="ed soft" marker-end="url(#f4-a)"/><text x="300" y="321.0" class="lb" text-anchor="middle" transform="rotate(-90 300 321.0)">names claims, any store</text><path d="M680,662 L700,662 L700,290 L600,290 L600,269" class="ed soft" marker-end="url(#f4-a)"/><path d="M330,647 L254,647" class="ed soft" marker-end="url(#f4-a)"/><text x="292" y="641" class="lb" text-anchor="middle">by name</text><text x="24" y="726" class="t3" text-anchor="start">A solid arrow is an edge node the store can follow; a dashed arrow is a value that names a record (an identity key, a producer string, a namespace and key), joined</text><text x="24" y="740" class="t3" text-anchor="start">in code. The rule and derivation classes must be loaded before a store that holds them is opened.</text></svg>
