<?xml version="1.0" encoding="UTF-8"?>
<svg width="1240" height="780" viewBox="0 0 1240 780" role="img" aria-label="the files of one graph directory, what each holds and which point into heap.dat and indexes.dat; the files outside it at the right" xmlns="http://www.w3.org/2000/svg"><style>
:root { --paper:#e9ecee; --surface:#f7f9fa; --sunk:#dfe4e7; --ink:#131b21; --muted:#56666f; --line:#79868e; --live:#0f6d63; --open:#8a5a00; --halt:#a02c26; --virt:#56399c;
  --face-text: Charter, "Iowan Old Style", "Charis SIL", Cambria, Georgia,
    "Times New Roman", serif;
  --face-data: ui-monospace, "DejaVu Sans Mono", "Liberation Mono", Menlo,
    Consolas, monospace; }
@media (prefers-color-scheme: dark) {
  :root { --paper:#0f1518; --surface:#172025; --sunk:#0a0f11; --ink:#e4eaed; --muted:#93a4ad; --line:#5d6a72; --live:#52c2b1; --open:#dda63f; --halt:#f2756c; --virt:#b49ae9; } }
.bg { fill: var(--surface); }
text { font-family: var(--face-text); }
.nd { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.nd.live { stroke: var(--live); stroke-width: 1.8; }
.nd.virt { stroke: var(--virt); stroke-width: 1.8; }
.nd.halt { stroke: var(--halt); stroke-width: 1.8; }
.nd.open { stroke: var(--open); stroke-width: 1.8; }
.nd.store { stroke: var(--ink); stroke-width: 2.6; }
.nd.sub { stroke-dasharray: 5 3; }
.nd.note { fill: none; stroke-dasharray: 2 3; }
.rg { fill: none; stroke: var(--line); stroke-width: 1.2;
  stroke-dasharray: 8 6; }
.hostbox { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.rt, .t1, .tm, .tms, .tk, .tag, .grp, .rn, .bt {
  font-family: var(--face-data); }
.rt { font-size: 11px; letter-spacing: 0.08em; fill: var(--muted); }
.t1 { font-size: 13px; font-weight: 700; fill: var(--ink); }
.t2 { font-size: 12px; fill: var(--muted); }
.t3 { font-size: 11px; fill: var(--muted); }
.tm { font-size: 11.5px; fill: var(--ink); }
.tms { font-size: 11.5px; font-weight: 700; fill: var(--ink); }
.tk { font-size: 11px; fill: var(--muted); }
.tby { font-size: 11px; font-style: italic; fill: var(--muted); }
.tag { font-size: 9.5px; letter-spacing: 0.1em; fill: var(--muted); }
.grp { font-size: 10.5px; letter-spacing: 0.1em; fill: var(--muted); }
.rn { font-size: 12px; fill: var(--ink); }
.rr { font-size: 11.5px; fill: var(--muted); }
.zebra { fill: var(--paper); opacity: 0.6; }
.badge { fill: var(--sunk); stroke: var(--line); stroke-width: 0.8; }
.bt { font-size: 10px; font-weight: 700; fill: var(--ink); }
.div { stroke: var(--sunk); stroke-width: 1; }
.dot { fill: var(--ink); }
.ed { fill: none; stroke: var(--ink); stroke-width: 1.3; }
.ed.soft { stroke-dasharray: 5 4; }
.ed.halt { stroke: var(--halt); stroke-width: 2; }
.ed.mut { stroke: var(--line); stroke-dasharray: 2 3; }
.halo { fill: none; stroke: var(--surface); stroke-width: 8; }
.lb { font-size: 11.5px; fill: var(--muted); paint-order: stroke;
  stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.lb.halt { fill: var(--halt); }
.ah { fill: var(--ink); }
.ah-h { fill: var(--halt); }
.ah-m { fill: var(--line); }
</style><rect width="100%" height="100%" class="bg"/><defs><marker id="f3-a" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah"/></marker><marker id="f3-h" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah-h"/></marker><marker id="f3-m" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah-m"/></marker></defs><path d="M24,67 L24,145 A115.0,7 0 0 0 254,145 L254,67" class="nd store"/><ellipse cx="139.0" cy="67" rx="115.0" ry="7" class="nd store"/><text x="34" y="90" class="t1" text-anchor="start">vertex/</text><text x="34" y="107" class="t2" text-anchor="start">linear hash: struct, config, table,</text><text x="34" y="122" class="t2" text-anchor="start">overflow .dat; key: the 16-byte id</text><text x="34" y="137" class="t2" text-anchor="start">value: the 33-byte node head</text><path d="M24,187 L24,265 A115.0,7 0 0 0 254,265 L254,187" class="nd store"/><ellipse cx="139.0" cy="187" rx="115.0" ry="7" class="nd store"/><text x="34" y="210" class="t1" text-anchor="start">edge/</text><text x="34" y="227" class="t2" text-anchor="start">the same four files; key: node id</text><text x="34" y="242" class="t2" text-anchor="start">value: the 73-byte edge head</text><text x="34" y="257" class="t2" text-anchor="start">(the head + from, to, weight)</text><path d="M24,327 L24,425 A115.0,7 0 0 0 254,425 L254,327" class="nd store"/><ellipse cx="139.0" cy="327" rx="115.0" ry="7" class="nd store"/><text x="34" y="350" class="t1" text-anchor="start">tx/  the write-ahead log</text><text x="34" y="367" class="t2" text-anchor="start">prep-&lt;seq&gt;.txn-tmp, renamed to</text><text x="34" y="382" class="t2" text-anchor="start">&lt;id&gt;.txn at commit; deleted (or</text><text x="34" y="397" class="t2" text-anchor="start">.committed) once applied; recovery</text><text x="34" y="412" class="t2" text-anchor="start">replays the rest. replication-&lt;id&gt;.log</text><path d="M24,469 L24,551 A115.0,7 0 0 0 254,551 L254,469" class="nd store"/><ellipse cx="139.0" cy="469" rx="115.0" ry="7" class="nd store"/><text x="34" y="492" class="t1" text-anchor="start">txn-log/  snapshots</text><text x="34" y="509" class="t2" text-anchor="start">snap-&lt;time&gt;-&lt;uuid&gt;: a plist per node,</text><text x="34" y="524" class="t2" text-anchor="start">written under in-progress/, renamed</text><text x="34" y="539" class="t2" text-anchor="start">close-graph takes one; :keep prunes</text><rect x="24" y="590" width="230" height="86" rx="6" class="nd"/><text x="34" y="610" class="t1" text-anchor="start">small sidecars</text><text x="34" y="627" class="t2" text-anchor="start">.dirty  while open; refuses a 2nd opener</text><text x="34" y="642" class="t2" text-anchor="start">transaction-id.dat  the highest id</text><text x="34" y="657" class="t2" text-anchor="start">policy.dat  with :recovery-policy only</text><path d="M340,67 L340,209 A140.0,7 0 0 0 620,209 L620,67" class="nd store"/><ellipse cx="480.0" cy="67" rx="140.0" ry="7" class="nd store"/><text x="350" y="90" class="t1" text-anchor="start">heap.dat</text><text x="350" y="107" class="t2" text-anchor="start">the binned allocator: magic, version 3,</text><text x="350" y="122" class="t2" text-anchor="start">128 free bins, data from byte 1034</text><text x="350" y="137" class="t2" text-anchor="start">node data at each head&#x27;s data-pointer</text><text x="350" y="152" class="t2" text-anchor="start">archived heads along prev-pointer (MVCC)</text><text x="350" y="167" class="t2" text-anchor="start">index-list cells of every adjacency chain</text><text x="350" y="182" class="t2" text-anchor="start">gc-heap sweeps it at open (:gc-heap-p)</text><path d="M340,307 L340,419 A140.0,7 0 0 0 620,419 L620,307" class="nd store"/><ellipse cx="480.0" cy="307" rx="140.0" ry="7" class="nd store"/><text x="350" y="330" class="t1" text-anchor="start">indexes.dat</text><text x="350" y="347" class="t2" text-anchor="start">a second allocator region, never reclaimed</text><text x="350" y="362" class="t2" text-anchor="start">every ordered map: views, :unique,</text><text x="350" y="377" class="t2" text-anchor="start">def-index, count and spatial indexes</text><text x="350" y="392" class="t2" text-anchor="start">a skip list or a B+ tree, tagged per map</text><rect x="340" y="470" width="280" height="100" rx="6" class="nd note"/><text x="350" y="490" class="t1" text-anchor="start">the memory-graph variant</text><text x="350" y="507" class="t2" text-anchor="start">no heap, tables or index files: graph.img,</text><text x="350" y="522" class="t2" text-anchor="start">a cl-store or VGMI native image, instead</text><text x="350" y="537" class="t2" text-anchor="start">tx/*.txn are kept until a checkpoint</text><text x="350" y="552" class="t2" text-anchor="start">no txn-log/ snapshot; .dirty tolerated</text><path d="M680,67 L680,133 A125.0,7 0 0 0 930,133 L930,67" class="nd store"/><ellipse cx="805.0" cy="67" rx="125.0" ry="7" class="nd store"/><text x="690" y="90" class="t1" text-anchor="start">ve-index-in/ · ve-index-out/</text><text x="690" y="107" class="t2" text-anchor="start">linear hash; key: node id + type id</text><text x="690" y="122" class="t2" text-anchor="start">value: a 17-byte index-list head</text><path d="M680,167 L680,233 A125.0,7 0 0 0 930,233 L930,167" class="nd store"/><ellipse cx="805.0" cy="167" rx="125.0" ry="7" class="nd store"/><text x="690" y="190" class="t1" text-anchor="start">vev-index/</text><text x="690" y="207" class="t2" text-anchor="start">key: out id, in id, type id (36 bytes)</text><text x="690" y="222" class="t2" text-anchor="start">value: an index-list head</text><path d="M680,267 L680,347 A125.0,7 0 0 0 930,347 L930,267" class="nd store"/><ellipse cx="805.0" cy="267" rx="125.0" ry="7" class="nd store"/><text x="690" y="290" class="t1" text-anchor="start">vertex-index.dat</text><text x="690" y="307" class="t2" text-anchor="start">and edge-index.dat: a raw array of</text><text x="690" y="322" class="t2" text-anchor="start">index-list heads by type id; 4096</text><text x="690" y="337" class="t2" text-anchor="start">slots, grows on demand</text><rect x="680" y="390" width="250" height="170" rx="6" class="nd"/><text x="690" y="410" class="t1" text-anchor="start">index sidecars</text><text x="690" y="427" class="t2" text-anchor="start">schema.dat  the cl-store&#x27;d schema</text><text x="690" y="442" class="t2" text-anchor="start">views.dat  per view: code, root, backend</text><text x="690" y="457" class="t2" text-anchor="start">spatial-indexes.dat  owner, slot, root,</text><text x="690" y="472" class="t2" text-anchor="start">   precision, backend, histogram</text><text x="690" y="487" class="t2" text-anchor="start">unique-, secondary-, count-indexes.dat</text><text x="690" y="502" class="t2" text-anchor="start">   roots only; written at close via .tmp</text><text x="690" y="517" class="t2" text-anchor="start">vseg-&lt;owner&gt;-&lt;slot&gt;.dat  vector segments</text><path d="M970,67 L970,161 A123.0,7 0 0 0 1216,161 L1216,67" class="nd store"/><ellipse cx="1093.0" cy="67" rx="123.0" ry="7" class="nd store"/><text x="980" y="90" class="t1" text-anchor="start">the system directory</text><text x="980" y="107" class="t2" text-anchor="start">outside every graph; *system-directory*</text><text x="980" y="122" class="t2" text-anchor="start">type-registry.log · store-registry.log</text><text x="980" y="137" class="t2" text-anchor="start">store-registry.lock · edge-occupancy.dat</text><text x="980" y="152" class="t2" text-anchor="start">schema-manifest.dat; flock across images</text><path d="M970,203 L970,283 A123.0,7 0 0 0 1216,283 L1216,203" class="nd store"/><ellipse cx="1093.0" cy="203" rx="123.0" ry="7" class="nd store"/><text x="980" y="226" class="t1" text-anchor="start">the clock directory</text><text x="980" y="243" class="t2" text-anchor="start">system-clock.lock  one owner (LOCK_EX)</text><text x="980" y="258" class="t2" text-anchor="start">system-clock.dat  the 8-byte ceiling</text><text x="980" y="273" class="t2" text-anchor="start">system-journal.log · restore-*.manifest</text><rect x="970" y="330" width="246" height="112" rx="6" class="nd note"/><text x="980" y="350" class="t1" text-anchor="start">peer role only</text><text x="980" y="367" class="t2" text-anchor="start">lamport.dat · pull-cursor.dat</text><text x="980" y="382" class="t2" text-anchor="start">push-ack.dat · field-stamps.dat</text><text x="980" y="397" class="t2" text-anchor="start">node-origins.dat · conflicts.dat</text><text x="980" y="412" class="t2" text-anchor="start">rejections.dat · applied-ops/ (lhash)</text><rect x="970" y="474" width="246" height="70" rx="6" class="nd note"/><text x="980" y="494" class="t1" text-anchor="start">shadow generations</text><text x="980" y="511" class="t2" text-anchor="start">lease.dat inside the shadow copy; retired</text><text x="980" y="526" class="t2" text-anchor="start">copies beside it: &lt;live&gt;-retired-&lt;epoch&gt;</text><path d="M254,106 L340,106" class="ed" marker-end="url(#f3-a)"/><text x="297" y="98" class="lb" text-anchor="middle">data-pointer,</text><text x="297" y="124" class="lb" text-anchor="middle">prev-pointer</text><path d="M254,226 L310,226 L310,150 L340,150" class="ed" marker-end="url(#f3-a)"/><path d="M680,100 L620,100" class="ed" marker-end="url(#f3-a)"/><text x="645" y="92" class="lb" text-anchor="middle">index-list</text><text x="645" y="118" class="lb" text-anchor="middle">cells</text><path d="M680,200 L620,200" class="ed" marker-end="url(#f3-a)"/><path d="M680,300 L650,300 L650,180 L620,180" class="ed" marker-end="url(#f3-a)"/><path d="M680,440 L650,440 L650,400 L620,400" class="ed soft" marker-end="url(#f3-a)"/><text x="636" y="394" class="lb" text-anchor="middle">roots</text><text x="24" y="726" class="t3" text-anchor="start">Heavy black: a file or directory the engine maps or appends to; a dotted box is optional or per variant. A solid arrow is a pointer stored in the file; a dashed one is a root</text><text x="24" y="740" class="t3" text-anchor="start">address that names a map. Not drawn: the legacy spatial-index.root, read only as a migration signal, and the unused main/meta/data.dat constants.</text></svg>
