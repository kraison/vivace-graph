<?xml version="1.0" encoding="UTF-8"?>
<svg width="1240" height="782" viewBox="0 0 1240 782" role="img" aria-label="what runs on the caller&#x27;s thread, the threads the engine starts and when, and the lock domains" xmlns="http://www.w3.org/2000/svg"><style>
:root { --paper:#e9ecee; --surface:#f7f9fa; --sunk:#dfe4e7; --ink:#131b21; --muted:#56666f; --line:#79868e; --live:#0f6d63; --open:#8a5a00; --halt:#a02c26; --virt:#56399c;
  --face-text: Charter, "Iowan Old Style", "Charis SIL", Cambria, Georgia,
    "Times New Roman", serif;
  --face-data: ui-monospace, "DejaVu Sans Mono", "Liberation Mono", Menlo,
    Consolas, monospace; }
@media (prefers-color-scheme: dark) {
  :root { --paper:#0f1518; --surface:#172025; --sunk:#0a0f11; --ink:#e4eaed; --muted:#93a4ad; --line:#5d6a72; --live:#52c2b1; --open:#dda63f; --halt:#f2756c; --virt:#b49ae9; } }
.bg { fill: var(--surface); }
text { font-family: var(--face-text); }
.nd { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.nd.live { stroke: var(--live); stroke-width: 1.8; }
.nd.virt { stroke: var(--virt); stroke-width: 1.8; }
.nd.halt { stroke: var(--halt); stroke-width: 1.8; }
.nd.open { stroke: var(--open); stroke-width: 1.8; }
.nd.store { stroke: var(--ink); stroke-width: 2.6; }
.nd.sub { stroke-dasharray: 5 3; }
.nd.note { fill: none; stroke-dasharray: 2 3; }
.rg { fill: none; stroke: var(--line); stroke-width: 1.2;
  stroke-dasharray: 8 6; }
.hostbox { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.rt, .t1, .tm, .tms, .tk, .tag, .grp, .rn, .bt {
  font-family: var(--face-data); }
.rt { font-size: 11px; letter-spacing: 0.08em; fill: var(--muted); }
.t1 { font-size: 13px; font-weight: 700; fill: var(--ink); }
.t2 { font-size: 12px; fill: var(--muted); }
.t3 { font-size: 11px; fill: var(--muted); }
.tm { font-size: 11.5px; fill: var(--ink); }
.tms { font-size: 11.5px; font-weight: 700; fill: var(--ink); }
.tk { font-size: 11px; fill: var(--muted); }
.tby { font-size: 11px; font-style: italic; fill: var(--muted); }
.tag { font-size: 9.5px; letter-spacing: 0.1em; fill: var(--muted); }
.grp { font-size: 10.5px; letter-spacing: 0.1em; fill: var(--muted); }
.rn { font-size: 12px; fill: var(--ink); }
.rr { font-size: 11.5px; fill: var(--muted); }
.zebra { fill: var(--paper); opacity: 0.6; }
.badge { fill: var(--sunk); stroke: var(--line); stroke-width: 0.8; }
.bt { font-size: 10px; font-weight: 700; fill: var(--ink); }
.div { stroke: var(--sunk); stroke-width: 1; }
.dot { fill: var(--ink); }
.ed { fill: none; stroke: var(--ink); stroke-width: 1.3; }
.ed.soft { stroke-dasharray: 5 4; }
.ed.halt { stroke: var(--halt); stroke-width: 2; }
.ed.mut { stroke: var(--line); stroke-dasharray: 2 3; }
.halo { fill: none; stroke: var(--surface); stroke-width: 8; }
.lb { font-size: 11.5px; fill: var(--muted); paint-order: stroke;
  stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.lb.halt { fill: var(--halt); }
.ah { fill: var(--ink); }
.ah-h { fill: var(--halt); }
.ah-m { fill: var(--line); }
</style><rect width="100%" height="100%" class="bg"/><defs><marker id="f5-a" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah"/></marker><marker id="f5-h" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah-h"/></marker><marker id="f5-m" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah-m"/></marker></defs><rect x="450" y="40" width="380" height="75" rx="6" class="nd live"/><text x="460" y="60" class="t1" text-anchor="start">buffer-pool-thread</text><text x="460" y="77" class="t2" text-anchor="start">one per process: the first open with :buffer-pool-p</text><text x="460" y="92" class="t2" text-anchor="start">loop: monitor-buffer-pool, then sleep 1; tops up free lists</text><text x="460" y="107" class="t2" text-anchor="start">close-graph never stops it; stop-buffer-pool joins</text><text x="820" y="60" class="tag" text-anchor="end">ANY DISK GRAPH</text><rect x="450" y="129" width="380" height="60" rx="6" class="nd live"/><text x="460" y="149" class="t1" text-anchor="start">server listener for &lt;name&gt;</text><text x="460" y="166" class="t2" text-anchor="start">start-replication; wait-for-input 1 s, then accept</text><text x="460" y="181" class="t2" text-anchor="start">stop-replication sets the flag and joins it</text><text x="820" y="149" class="tag" text-anchor="end">MASTER</text><rect x="450" y="203" width="380" height="75" rx="6" class="nd live"/><text x="460" y="223" class="t1" text-anchor="start">slave session  (one per slave)</text><text x="460" y="240" class="t2" text-anchor="start">handshake; replays tx/replication-*.log; then every</text><text x="460" y="255" class="t2" text-anchor="start">mailbox message (:timeout 1) to the socket</text><text x="460" y="270" class="t2" text-anchor="start">exits on :shutdown, the flag or a broken pipe; not joined</text><text x="820" y="223" class="tag" text-anchor="end">MASTER</text><rect x="450" y="292" width="380" height="75" rx="6" class="nd live"/><text x="460" y="312" class="t1" text-anchor="start">&lt;name&gt;-repl-slave-thread</text><text x="460" y="329" class="t2" text-anchor="start">connects (10 tries, doubling backoff); reads a tx into</text><text x="460" y="344" class="t2" text-anchor="start">tx/*.txn, then apply-transaction: no TM lock, no OCC</text><text x="460" y="359" class="t2" text-anchor="start">reconnects on EOF; stop: flag + join</text><text x="820" y="312" class="tag" text-anchor="end">SLAVE</text><rect x="450" y="381" width="380" height="60" rx="6" class="nd live"/><text x="460" y="401" class="t1" text-anchor="start">&lt;name&gt;-peer-hub · peer hub session</text><text x="460" y="418" class="t2" text-anchor="start">accept; per device: handshake, auth, a pull phase under</text><text x="460" y="433" class="t2" text-anchor="start">with-read-snapshot, a push phase through with-transaction</text><text x="820" y="401" class="tag" text-anchor="end">HUB</text><rect x="450" y="455" width="380" height="75" rx="6" class="nd live"/><text x="460" y="475" class="t1" text-anchor="start">&lt;name&gt;-peer-writer</text><text x="460" y="492" class="t2" text-anchor="start">the store&#x27;s single writer: mailbox ops :state-create,</text><text x="460" y="507" class="t2" text-anchor="start">:authored, :purge, :barrier, :local-write; replies on a</text><text x="460" y="522" class="t2" text-anchor="start">per-request mailbox; :shutdown + join</text><text x="820" y="475" class="tag" text-anchor="end">DEVICE</text><rect x="450" y="544" width="380" height="75" rx="6" class="nd live"/><text x="460" y="564" class="t1" text-anchor="start">forward timer  (one per graph)</text><text x="460" y="581" class="t2" text-anchor="start">started by the first threshold timer, not by enable-</text><text x="460" y="596" class="t2" text-anchor="start">forward-rules; condition-wait to the earliest instant;</text><text x="460" y="611" class="t2" text-anchor="start">fires forward-step here unless :drain :caller; joined</text><text x="820" y="564" class="tag" text-anchor="end">RULES</text><rect x="450" y="633" width="380" height="75" rx="6" class="nd live"/><text x="460" y="653" class="t1" text-anchor="start">clack-handler-hunchentoot</text><text x="460" y="670" class="t2" text-anchor="start">only after start-rest or start-gui: a listener thread,</text><text x="460" y="685" class="t2" text-anchor="start">then one hunchentoot-worker per connection (the default</text><text x="460" y="700" class="t2" text-anchor="start">taskmaster); stop-rest, stop-gui</text><text x="820" y="653" class="tag" text-anchor="end">HTTP</text><rect x="24" y="40" width="340" height="668" rx="6" class="nd live"/><text x="36" y="62" class="t1" text-anchor="start">the caller&#x27;s thread</text><text x="36" y="80" class="t2" text-anchor="start">an application thread, an HTTP worker,</text><text x="36" y="95" class="t2" text-anchor="start">a hub session or the forward timer</text><text x="36" y="118" class="grp" text-anchor="start">A COMMIT  (figure 6)</text><text x="38" y="142.5" class="rn" text-anchor="start">the body</text><text x="142" y="142.5" class="rr" text-anchor="start">reads record a read-set; writes a write-set</text><rect x="25" y="150" width="338" height="24" rx="0" class="zebra"/><text x="38" y="166.5" class="rn" text-anchor="start">prepare</text><text x="142" y="166.5" class="rr" text-anchor="start">serialize to tx/prep-&lt;seq&gt;.txn-tmp</text><text x="38" y="190.5" class="rn" text-anchor="start">validate</text><text x="142" y="190.5" class="rr" text-anchor="start">under the TM lock; retry on conflict</text><rect x="25" y="198" width="338" height="24" rx="0" class="zebra"/><text x="38" y="214.5" class="rn" text-anchor="start">rename</text><text x="142" y="214.5" class="rr" text-anchor="start">tx/&lt;id&gt;.txn: the durability point</text><text x="38" y="238.5" class="rn" text-anchor="start">apply</text><text x="142" y="238.5" class="rr" text-anchor="start">heads, cache, views, spatial, vectors</text><rect x="25" y="246" width="338" height="24" rx="0" class="zebra"/><text x="38" y="262.5" class="rn" text-anchor="start">indexes</text><text x="142" y="262.5" class="rr" text-anchor="start">unique, secondary, count</text><text x="38" y="286.5" class="rn" text-anchor="start">reap</text><text x="142" y="286.5" class="rr" text-anchor="start">old versions above the floor</text><rect x="25" y="294" width="338" height="24" rx="0" class="zebra"/><text x="38" y="310.5" class="rn" text-anchor="start">hooks</text><text x="142" y="310.5" class="rr" text-anchor="start">*after-commit-hooks*: forward-step</text><text x="36" y="336" class="grp" text-anchor="start">AT OPEN</text><text x="38" y="360.5" class="rn" text-anchor="start">recover</text><text x="142" y="360.5" class="rr" text-anchor="start">replay the tx/*.txn left behind</text><rect x="25" y="368" width="338" height="24" rx="0" class="zebra"/><text x="38" y="384.5" class="rn" text-anchor="start">gc-heap</text><text x="142" y="384.5" class="rr" text-anchor="start">sweep heap.dat (:gc-heap-p)</text><text x="38" y="408.5" class="rn" text-anchor="start">rebuild</text><text x="142" y="408.5" class="rr" text-anchor="start">stale spatial, unique, count indexes</text><text x="36" y="434" class="grp" text-anchor="start">ON DEMAND</text><rect x="25" y="442" width="338" height="24" rx="0" class="zebra"/><text x="38" y="458.5" class="rn" text-anchor="start">snapshot</text><text x="142" y="458.5" class="rr" text-anchor="start">txn-log/snap-*; close-graph&#x27;s default</text><text x="38" y="482.5" class="rn" text-anchor="start">replay</text><text x="142" y="482.5" class="rr" text-anchor="start">a snapshot into a fresh store</text><rect x="25" y="490" width="338" height="24" rx="0" class="zebra"/><text x="38" y="506.5" class="rn" text-anchor="start">peer-sync</text><text x="142" y="506.5" class="rr" text-anchor="start">a device pulls, then pushes</text><text x="38" y="530.5" class="rn" text-anchor="start">link sweep</text><text x="142" y="530.5" class="rr" text-anchor="start">claim endpoints, under a graph lock</text><rect x="25" y="538" width="338" height="24" rx="0" class="zebra"/><text x="38" y="554.5" class="rn" text-anchor="start">forward-step</text><text x="142" y="554.5" class="rr" text-anchor="start">with :drain :caller, on this thread</text><rect x="866" y="40" width="350" height="501" rx="6" class="nd"/><text x="878" y="62" class="t1" text-anchor="start">lock domains</text><text x="878" y="82" class="tms" text-anchor="start">TM lock</text><text x="878" y="97" class="t3" text-anchor="start">a recursive mutex per store: create-transaction,</text><text x="878" y="111" class="t3" text-anchor="start">all of %commit; the retry fallback holds it for the body</text><text x="878" y="133" class="tms" text-anchor="start">under it, in order</text><text x="878" y="148" class="t3" text-anchor="start">system-clock lock (tm-next-epoch) ·</text><text x="878" y="162" class="t3" text-anchor="start">replication-log-lock · lamport-lock · the per-tx rw-lock ·</text><text x="878" y="176" class="t3" text-anchor="start">lhash split lock then bucket · type-index stripes · view-group</text><text x="878" y="190" class="t3" text-anchor="start">write locks (try-lock + sleep) · read-pins-lock · watermark-lock</text><text x="878" y="212" class="tms" text-anchor="start">txn-lock</text><text x="878" y="227" class="t3" text-anchor="start">snapshot and spatial rebuilds only; not on the</text><text x="878" y="241" class="t3" text-anchor="start">commit path</text><text x="878" y="263" class="tms" text-anchor="start">views-lock</text><text x="878" y="278" class="t3" text-anchor="start">save-views; per-view-group rw-locks: map and</text><text x="878" y="292" class="t3" text-anchor="start">reduce read, regenerate and delete write</text><text x="878" y="314" class="tms" text-anchor="start">slaves-lock</text><text x="878" y="329" class="t3" text-anchor="start">session add and remove; broadcast reads without it</text><text x="878" y="351" class="tms" text-anchor="start">*forward-states-lock*</text><text x="878" y="366" class="t3" text-anchor="start">then a per-state lock; the timer holds</text><text x="878" y="380" class="t3" text-anchor="start">the state lock while it waits</text><text x="878" y="402" class="tms" text-anchor="start">*gui-rw-lock*</text><text x="878" y="417" class="t3" text-anchor="start">outermost in the GUI: reads shared, open and</text><text x="878" y="431" class="t3" text-anchor="start">close exclusive</text><text x="878" y="453" class="tms" text-anchor="start">buffer pool</text><text x="878" y="468" class="t3" text-anchor="start">*buffer-pool-lock* on CCL and ECL; atomic</text><text x="878" y="482" class="t3" text-anchor="start">push and pop on SBCL</text><text x="878" y="504" class="tms" text-anchor="start">per-class rw-locks</text><text x="878" y="519" class="t3" text-anchor="start">created by the schema, taken by nothing</text><path d="M364,138.0 L419.0,138.0 L419.0,70 L450,70" class="ed" marker-end="url(#f5-a)" marker-start="url(#f5-a)"/><text x="413.0" y="64" class="lb" text-anchor="end">get-buffer</text><path d="M364,234.0 L407.0,234.0 L407.0,233 L450,233" class="ed" marker-end="url(#f5-a)"/><text x="413.0" y="227" class="lb" text-anchor="start">the tx</text><path d="M364,306.0 L395.0,306.0 L395.0,574 L450,574" class="ed" marker-end="url(#f5-a)"/><text x="401.0" y="568" class="lb" text-anchor="start">a timer</text><path d="M450,663 L364,663" class="ed" marker-end="url(#f5-a)"/><text x="407.0" y="657" class="lb" text-anchor="middle">a request</text><path d="M800,189 L800,203" class="ed" marker-end="url(#f5-a)"/><text x="794" y="198" class="lb" text-anchor="end">accept, spawn</text><text x="24" y="738" class="t3" text-anchor="start">Teal: a thread of this process. Threads exist by role: a plain graph starts only the buffer pool; shadow opens start no replication thread. The arrows say what passes</text><text x="24" y="752" class="t3" text-anchor="start">between the caller and a thread. Not drawn: CCL&#x27;s per-poll &quot;Timed Process&quot; threads under receive-message, and log4cl&#x27;s watcher, which only an application&#x27;s</text><text x="24" y="766" class="t3" text-anchor="start">appender starts.</text></svg>
