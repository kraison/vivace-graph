<?xml version="1.0" encoding="UTF-8"?>
<svg width="1240" height="1010" viewBox="0 0 1240 1010" role="img" aria-label="the layers of graph-db/core in load order and the systems built on it, with what each takes from the core" xmlns="http://www.w3.org/2000/svg"><style>
:root { --paper:#e9ecee; --surface:#f7f9fa; --sunk:#dfe4e7; --ink:#131b21; --muted:#56666f; --line:#79868e; --live:#0f6d63; --open:#8a5a00; --halt:#a02c26; --virt:#56399c;
  --face-text: Charter, "Iowan Old Style", "Charis SIL", Cambria, Georgia,
    "Times New Roman", serif;
  --face-data: ui-monospace, "DejaVu Sans Mono", "Liberation Mono", Menlo,
    Consolas, monospace; }
@media (prefers-color-scheme: dark) {
  :root { --paper:#0f1518; --surface:#172025; --sunk:#0a0f11; --ink:#e4eaed; --muted:#93a4ad; --line:#5d6a72; --live:#52c2b1; --open:#dda63f; --halt:#f2756c; --virt:#b49ae9; } }
.bg { fill: var(--surface); }
text { font-family: var(--face-text); }
.nd { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.nd.live { stroke: var(--live); stroke-width: 1.8; }
.nd.virt { stroke: var(--virt); stroke-width: 1.8; }
.nd.halt { stroke: var(--halt); stroke-width: 1.8; }
.nd.open { stroke: var(--open); stroke-width: 1.8; }
.nd.store { stroke: var(--ink); stroke-width: 2.6; }
.nd.sub { stroke-dasharray: 5 3; }
.nd.note { fill: none; stroke-dasharray: 2 3; }
.rg { fill: none; stroke: var(--line); stroke-width: 1.2;
  stroke-dasharray: 8 6; }
.hostbox { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.rt, .t1, .tm, .tms, .tk, .tag, .grp, .rn, .bt {
  font-family: var(--face-data); }
.rt { font-size: 11px; letter-spacing: 0.08em; fill: var(--muted); }
.t1 { font-size: 13px; font-weight: 700; fill: var(--ink); }
.t2 { font-size: 12px; fill: var(--muted); }
.t3 { font-size: 11px; fill: var(--muted); }
.tm { font-size: 11.5px; fill: var(--ink); }
.tms { font-size: 11.5px; font-weight: 700; fill: var(--ink); }
.tk { font-size: 11px; fill: var(--muted); }
.tby { font-size: 11px; font-style: italic; fill: var(--muted); }
.tag { font-size: 9.5px; letter-spacing: 0.1em; fill: var(--muted); }
.grp { font-size: 10.5px; letter-spacing: 0.1em; fill: var(--muted); }
.rn { font-size: 12px; fill: var(--ink); }
.rr { font-size: 11.5px; fill: var(--muted); }
.zebra { fill: var(--paper); opacity: 0.6; }
.badge { fill: var(--sunk); stroke: var(--line); stroke-width: 0.8; }
.bt { font-size: 10px; font-weight: 700; fill: var(--ink); }
.div { stroke: var(--sunk); stroke-width: 1; }
.dot { fill: var(--ink); }
.ed { fill: none; stroke: var(--ink); stroke-width: 1.3; }
.ed.soft { stroke-dasharray: 5 4; }
.ed.halt { stroke: var(--halt); stroke-width: 2; }
.ed.mut { stroke: var(--line); stroke-dasharray: 2 3; }
.halo { fill: none; stroke: var(--surface); stroke-width: 8; }
.lb { font-size: 11.5px; fill: var(--muted); paint-order: stroke;
  stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.lb.halt { fill: var(--halt); }
.ah { fill: var(--ink); }
.ah-h { fill: var(--halt); }
.ah-m { fill: var(--line); }
</style><rect width="100%" height="100%" class="bg"/><defs><marker id="f1-a" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah"/></marker><marker id="f1-h" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah-h"/></marker><marker id="f1-m" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah-m"/></marker></defs><rect x="24" y="40" width="440" height="86" rx="6" class="nd live"/><text x="34" y="60" class="t1" text-anchor="start">8  API, secondary indexes, constraints, the in-RAM backend</text><text x="34" y="77" class="t2" text-anchor="start">interface · traverse · memory-graph · unique-constraint · index</text><text x="34" y="92" class="t2" text-anchor="start">count-index · value-constraint · cardinality · domain-range</text><text x="34" y="107" class="t2" text-anchor="start">evaluator · disjointness · spatial-registry</text><text x="34" y="122" class="t2" text-anchor="start">save, mark-deleted, traverse; def-index, def-unique; make-memory-graph</text><rect x="24" y="140" width="440" height="86" rx="6" class="nd live"/><text x="34" y="160" class="t1" text-anchor="start">7  Prolog engine</text><text x="34" y="177" class="t2" text-anchor="start">functor · prologc · prolog-tabling · prolog-functors</text><text x="34" y="192" class="t2" text-anchor="start">prolog-graph-predicates · spatial-query · prolog-explain</text><text x="34" y="207" class="t2" text-anchor="start">select, select-flat, do-query; &lt;-; table-functor; explain-goals</text><rect x="24" y="240" width="440" height="86" rx="6" class="nd live"/><text x="34" y="260" class="t1" text-anchor="start">6  Transactions, durability, recovery</text><text x="34" y="277" class="t2" text-anchor="start">transactions · tx-overlay · transaction-restore</text><text x="34" y="292" class="t2" text-anchor="start">transaction-log-streaming · shadow-store · system-restore</text><text x="34" y="307" class="t2" text-anchor="start">backup · replication · txn-log</text><text x="34" y="322" class="t2" text-anchor="start">with-transaction, update-node, delete-node; snapshot, replay</text><rect x="24" y="340" width="440" height="86" rx="6" class="nd live"/><text x="34" y="360" class="t1" text-anchor="start">5  Schema and object model</text><text x="34" y="377" class="t2" text-anchor="start">schema · runtime-schema · schema-tools · type-seeding</text><text x="34" y="392" class="t2" text-anchor="start">node-class · views · primitive-node · vertex · edge · gc</text><text x="34" y="407" class="t2" text-anchor="start">def-vertex, def-edge, def-view; lookup-vertex, map-vertices, outgoing-edges</text><rect x="24" y="440" width="440" height="86" rx="6" class="nd live"/><text x="34" y="460" class="t1" text-anchor="start">4  Graph store and adjacency</text><text x="34" y="477" class="t2" text-anchor="start">graph-class · ve-index · vev-index · type-index · graph · stats</text><text x="34" y="492" class="t2" text-anchor="start">make-graph, open-graph, close-graph; the *graphs* registry</text><rect x="24" y="540" width="440" height="86" rx="6" class="nd live"/><text x="34" y="560" class="t1" text-anchor="start">3  Collections and spatial primitives</text><text x="34" y="577" class="t2" text-anchor="start">geometry · geometry-ops · geohash · linear-hash · cursors</text><text x="34" y="592" class="t2" text-anchor="start">skip-list · skip-list-cursors · mem-skip-list · bplus-tree</text><text x="34" y="607" class="t2" text-anchor="start">spatial-index · index-list</text><text x="34" y="622" class="t2" text-anchor="start">on-disk hash tables and ordered maps; geohash cells</text><rect x="24" y="640" width="440" height="86" rx="6" class="nd live"/><text x="34" y="660" class="t1" text-anchor="start">2  System-directory registries</text><text x="34" y="677" class="t2" text-anchor="start">sidecar-io · system-clock · type-registry · store-registry</text><text x="34" y="692" class="t2" text-anchor="start">type-occupancy</text><text x="34" y="707" class="t2" text-anchor="start">type ids, store ids and the epoch clock, shared through files</text><rect x="24" y="740" width="440" height="86" rx="6" class="nd live"/><text x="34" y="760" class="t1" text-anchor="start">1  Platform and storage primitives</text><text x="34" y="777" class="t2" text-anchor="start">package · cl-store-ecl · globals · conditions · posix · utilities</text><text x="34" y="792" class="t2" text-anchor="start">queue · mailbox · rw-lock · mmap · pcons · node-id · buffer-pool</text><text x="34" y="807" class="t2" text-anchor="start">serialize · allocator · segment</text><text x="34" y="822" class="t2" text-anchor="start">mmap and POSIX over CFFI; the binned heap; binary serialization</text><path d="M24,877 L24,933 A105.0,7 0 0 0 234,933 L234,877" class="nd store"/><ellipse cx="129.0" cy="877" rx="105.0" ry="7" class="nd store"/><text x="34" y="900" class="t1" text-anchor="start">graph directories</text><text x="34" y="917" class="t2" text-anchor="start">one per store (figure 3)</text><path d="M254,877 L254,933 A105.0,7 0 0 0 464,933 L464,877" class="nd store"/><ellipse cx="359.0" cy="877" rx="105.0" ry="7" class="nd store"/><text x="264" y="900" class="t1" text-anchor="start">the system directory</text><text x="264" y="917" class="t2" text-anchor="start">registries and the clock</text><path d="M128,826 L128,870" class="ed" marker-end="url(#f1-a)"/><text x="136" y="856" class="lb" text-anchor="start">mmap, pwrite, rename</text><path d="M358,826 L358,870" class="ed" marker-end="url(#f1-a)"/><text x="366" y="856" class="lb" text-anchor="start">append under flock</text><rect x="620" y="40" width="260" height="86" rx="6" class="nd live"/><text x="630" y="60" class="t1" text-anchor="start">graph-db/rules</text><text x="630" y="77" class="t2" text-anchor="start">rules/: facts, schema, compile, run, delta,</text><text x="630" y="92" class="t2" text-anchor="start">forward, thresholds, productions, standing</text><text x="630" y="107" class="t2" text-anchor="start">def-rule, run-rules, enable-forward-rules</text><text x="630" y="122" class="t2" text-anchor="start">hooks *after-commit-hooks* for forward steps</text><rect x="620" y="140" width="260" height="86" rx="6" class="nd live"/><text x="630" y="160" class="t1" text-anchor="start">graph-db/spacetime</text><text x="630" y="177" class="t2" text-anchor="start">spacetime/: claim, claim-query, source,</text><text x="630" y="192" class="t2" text-anchor="start">resolve, link, register, membership, temporal</text><text x="630" y="207" class="t2" text-anchor="start">def-claim-classes, def-source, retract-claim</text><text x="630" y="222" class="t2" text-anchor="start">+ cl-temporal-extent, local-time</text><rect x="620" y="240" width="260" height="86" rx="6" class="nd live"/><text x="630" y="260" class="t1" text-anchor="start">graph-db/query</text><text x="630" y="277" class="t2" text-anchor="start">query/: compiled-cache, dsl, guard</text><text x="630" y="292" class="t2" text-anchor="start">run-guarded-prolog, run-pattern-query,</text><text x="630" y="307" class="t2" text-anchor="start">run-query-goals; the compiled-query cache</text><text x="630" y="322" class="t2" text-anchor="start">+ cl-json</text><rect x="620" y="340" width="260" height="86" rx="6" class="nd live"/><text x="630" y="360" class="t1" text-anchor="start">graph-db/replication</text><text x="630" y="377" class="t2" text-anchor="start">transaction-streaming, peer-merge,</text><text x="630" y="392" class="t2" text-anchor="start">peer-streaming: the TCP transport for</text><text x="630" y="407" class="t2" text-anchor="start">master/slave and hub/device roles</text><text x="630" y="422" class="t2" text-anchor="start">+ usocket</text><rect x="620" y="450" width="260" height="76" rx="6" class="nd live"/><text x="630" y="470" class="t1" text-anchor="start">graph-db/geos</text><text x="630" y="487" class="t2" text-anchor="start">geos/: ffi, context, bridge, ops</text><text x="630" y="502" class="t2" text-anchor="start">libgeos_c in-process; soft-fails when absent</text><text x="630" y="517" class="t2" text-anchor="start">needs the full graph-db to load (its .asd)</text><rect x="960" y="40" width="256" height="86" rx="6" class="nd live"/><text x="970" y="60" class="t1" text-anchor="start">graph-db/algorithms (+ -io)</text><text x="970" y="77" class="t2" text-anchor="start">shortest-path, page-rank, components,</text><text x="970" y="92" class="t2" text-anchor="start">flow, projection; GML, Pajek, Graphviz</text><text x="970" y="107" class="t2" text-anchor="start">needs only the core</text><text x="970" y="122" class="t2" text-anchor="start">+ cl-ppcre, yacc, parse-number</text><rect x="960" y="140" width="256" height="86" rx="6" class="nd live"/><text x="970" y="160" class="t1" text-anchor="start">graph-db/gui</text><text x="970" y="177" class="t2" text-anchor="start">gui/: api, prolog, server + static/</text><text x="970" y="192" class="t2" text-anchor="start">start-gui, make-gui-app; the cockpit</text><text x="970" y="207" class="t2" text-anchor="start">+ ningle, clack, cl-json</text><rect x="960" y="240" width="256" height="86" rx="6" class="nd live"/><text x="970" y="260" class="t1" text-anchor="start">graph-db  (the full system)</text><text x="970" y="277" class="t2" text-anchor="start">rest.lisp: start-rest, def-rest-procedure,</text><text x="970" y="292" class="t2" text-anchor="start">def-query, add-rest-user</text><text x="970" y="307" class="t2" text-anchor="start">= core + replication + query + REST</text><text x="970" y="322" class="t2" text-anchor="start">+ hunchentoot, ningle, clack</text><path d="M620,170 L560,170 L560,90 L464,90" class="ed" marker-end="url(#f1-a)"/><text x="512" y="84" class="lb" text-anchor="middle">schema, indexes,</text><text x="512" y="104" class="lb" text-anchor="middle">commit validators</text><path d="M620,270 L540,270 L540,170 L464,170" class="ed" marker-end="url(#f1-a)"/><text x="502" y="164" class="lb" text-anchor="middle">goals, bindings</text><path d="M620,386 L590,386 L590,296 L464,296" class="ed" marker-end="url(#f1-a)" marker-start="url(#f1-a)"/><text x="527" y="290" class="lb" text-anchor="middle">replicate-transaction</text><text x="527" y="310" class="lb" text-anchor="middle">apply-transaction</text><path d="M620,500 L600,500 L600,564 L464,564" class="ed" marker-end="url(#f1-a)"/><text x="532" y="558" class="lb" text-anchor="middle">geometry ops</text><path d="M750,126 L750,140" class="ed" marker-end="url(#f1-a)"/><text x="758" y="136" class="lb" text-anchor="start">claims, derivations</text><path d="M880,100 L912,100 L912,284 L880,284" class="ed" marker-end="url(#f1-a)"/><text x="918" y="110" class="lb" text-anchor="start" transform="rotate(90 918 110)">compiled goals</text><path d="M1088,226 L1088,240" class="ed" marker-end="url(#f1-a)"/><text x="1096" y="236" class="lb" text-anchor="start">stores, Prolog, stats</text><path d="M960,264 L880,264" class="halo"/><path d="M960,264 L880,264" class="ed" marker-end="url(#f1-a)"/><text x="920" y="252" class="lb" text-anchor="middle">guarded</text><text x="920" y="286" class="lb" text-anchor="middle">queries</text><path d="M960,312 L940,312 L940,370 L880,370" class="ed" marker-end="url(#f1-a)"/><text x="886" y="388" class="lb" text-anchor="start">master, slave, peer roles</text><path d="M1088,40 L1088,22 L400,22 L400,40" class="ed" marker-end="url(#f1-a)"/><text x="700" y="16" class="lb" text-anchor="middle">map-vertices, outgoing-edges, with-transaction</text><text x="24" y="970" class="t3" text-anchor="start">Teal: a system of this repository, loaded into one Lisp image; heavy black: files on disk. Each core row loads after the one beneath it. An arrow says what the</text><text x="24" y="984" class="t3" text-anchor="start">upper side takes from the lower; the two-headed one is a call each way. Not drawn: the test systems, the profiler, and the forward declarations by which lower core</text><text x="24" y="998" class="t3" text-anchor="start">files call upper ones (graph.lisp:3-16, transactions.lisp:3-11).</text></svg>
