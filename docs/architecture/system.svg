<?xml version="1.0" encoding="UTF-8"?>
<svg width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-label="a graph-db image, the processes that connect to it, the files it keeps and the subprocesses it runs" xmlns="http://www.w3.org/2000/svg"><style>
:root { --paper:#e9ecee; --surface:#f7f9fa; --sunk:#dfe4e7; --ink:#131b21; --muted:#56666f; --line:#79868e; --live:#0f6d63; --open:#8a5a00; --halt:#a02c26; --virt:#56399c;
  --face-text: Charter, "Iowan Old Style", "Charis SIL", Cambria, Georgia,
    "Times New Roman", serif;
  --face-data: ui-monospace, "DejaVu Sans Mono", "Liberation Mono", Menlo,
    Consolas, monospace; }
@media (prefers-color-scheme: dark) {
  :root { --paper:#0f1518; --surface:#172025; --sunk:#0a0f11; --ink:#e4eaed; --muted:#93a4ad; --line:#5d6a72; --live:#52c2b1; --open:#dda63f; --halt:#f2756c; --virt:#b49ae9; } }
.bg { fill: var(--surface); }
text { font-family: var(--face-text); }
.nd { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.nd.live { stroke: var(--live); stroke-width: 1.8; }
.nd.virt { stroke: var(--virt); stroke-width: 1.8; }
.nd.halt { stroke: var(--halt); stroke-width: 1.8; }
.nd.open { stroke: var(--open); stroke-width: 1.8; }
.nd.store { stroke: var(--ink); stroke-width: 2.6; }
.nd.sub { stroke-dasharray: 5 3; }
.nd.note { fill: none; stroke-dasharray: 2 3; }
.rg { fill: none; stroke: var(--line); stroke-width: 1.2;
  stroke-dasharray: 8 6; }
.hostbox { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.rt, .t1, .tm, .tms, .tk, .tag, .grp, .rn, .bt {
  font-family: var(--face-data); }
.rt { font-size: 11px; letter-spacing: 0.08em; fill: var(--muted); }
.t1 { font-size: 13px; font-weight: 700; fill: var(--ink); }
.t2 { font-size: 12px; fill: var(--muted); }
.t3 { font-size: 11px; fill: var(--muted); }
.tm { font-size: 11.5px; fill: var(--ink); }
.tms { font-size: 11.5px; font-weight: 700; fill: var(--ink); }
.tk { font-size: 11px; fill: var(--muted); }
.tby { font-size: 11px; font-style: italic; fill: var(--muted); }
.tag { font-size: 9.5px; letter-spacing: 0.1em; fill: var(--muted); }
.grp { font-size: 10.5px; letter-spacing: 0.1em; fill: var(--muted); }
.rn { font-size: 12px; fill: var(--ink); }
.rr { font-size: 11.5px; fill: var(--muted); }
.zebra { fill: var(--paper); opacity: 0.6; }
.badge { fill: var(--sunk); stroke: var(--line); stroke-width: 0.8; }
.bt { font-size: 10px; font-weight: 700; fill: var(--ink); }
.div { stroke: var(--sunk); stroke-width: 1; }
.dot { fill: var(--ink); }
.ed { fill: none; stroke: var(--ink); stroke-width: 1.3; }
.ed.soft { stroke-dasharray: 5 4; }
.ed.halt { stroke: var(--halt); stroke-width: 2; }
.ed.mut { stroke: var(--line); stroke-dasharray: 2 3; }
.halo { fill: none; stroke: var(--surface); stroke-width: 8; }
.lb { font-size: 11.5px; fill: var(--muted); paint-order: stroke;
  stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.lb.halt { fill: var(--halt); }
.ah { fill: var(--ink); }
.ah-h { fill: var(--halt); }
.ah-m { fill: var(--line); }
</style><rect width="100%" height="100%" class="bg"/><defs><marker id="f2-a" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah"/></marker><marker id="f2-h" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah-h"/></marker><marker id="f2-m" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah-m"/></marker></defs><rect x="12" y="20" width="880" height="650" rx="10" class="rg"/><text x="880" y="40" class="rt" text-anchor="end">ONE HOST</text><rect x="926" y="20" width="302" height="650" rx="10" class="rg"/><text x="1212" y="40" class="rt" text-anchor="end">OTHER PROCESSES · ANY HOST</text><rect x="28" y="56" width="836" height="352" rx="8" class="hostbox"/><text x="848" y="78" class="rt" text-anchor="end">a graph-db image · one Lisp process</text><rect x="44" y="96" width="320" height="290" rx="6" class="nd live"/><text x="54" y="116" class="t1" text-anchor="start">graph-db/core</text><text x="54" y="133" class="t2" text-anchor="start">Every open store: its tables, indexes</text><text x="54" y="148" class="t2" text-anchor="start">and transaction manager.  A commit, its</text><text x="54" y="163" class="t2" text-anchor="start">journal write, the apply, the reaper, view</text><text x="54" y="178" class="t2" text-anchor="start">and index upkeep and forward derivation</text><text x="54" y="193" class="t2" text-anchor="start">all run on the caller&#x27;s thread (figure 5).</text><text x="54" y="208" class="t2" text-anchor="start"></text><text x="54" y="223" class="t2" text-anchor="start">Started threads: buffer-pool-thread (one</text><text x="54" y="238" class="t2" text-anchor="start">per process), the replication threads,</text><text x="54" y="253" class="t2" text-anchor="start">a forward timer per graph on demand.</text><rect x="600" y="92" width="248" height="70" rx="6" class="nd live"/><text x="610" y="112" class="t1" text-anchor="start">replication listener</text><text x="610" y="129" class="t2" text-anchor="start">master or hub role; start-replication</text><text x="610" y="144" class="t2" text-anchor="start">all interfaces · :replication-port</text><text x="610" y="159" class="t2" text-anchor="start">framed packets, protocol 2, no TLS</text><rect x="600" y="172" width="248" height="70" rx="6" class="nd live"/><text x="610" y="192" class="t1" text-anchor="start">replication client</text><text x="610" y="209" class="t2" text-anchor="start">slave or device role; connects out</text><text x="610" y="224" class="t2" text-anchor="start">to master-host · peer-host</text><text x="610" y="239" class="t2" text-anchor="start">slave: receive, apply; device: pull, push</text><rect x="600" y="252" width="248" height="70" rx="6" class="nd live"/><text x="610" y="272" class="t1" text-anchor="start">start-gui</text><text x="610" y="289" class="t2" text-anchor="start">clack · JSON + vendored static files</text><text x="610" y="304" class="t2" text-anchor="start">127.0.0.1:4270 · no authentication</text><text x="610" y="319" class="t2" text-anchor="start">or mounted in a host&#x27;s own app</text><rect x="600" y="332" width="248" height="70" rx="6" class="nd live"/><text x="610" y="352" class="t1" text-anchor="start">start-rest</text><text x="610" y="369" class="t2" text-anchor="start">hunchentoot via clack · JSON</text><text x="610" y="384" class="t2" text-anchor="start">127.0.0.1:8080 by default</text><text x="610" y="399" class="t2" text-anchor="start">username and password per request</text><path d="M364,120 L600,120" class="ed" marker-end="url(#f2-a)"/><text x="482" y="114" class="lb" text-anchor="middle">each commit, via a mailbox</text><path d="M600,200 L364,200" class="ed" marker-end="url(#f2-a)"/><text x="482" y="194" class="lb" text-anchor="middle">apply-transaction, no OCC</text><path d="M600,280 L364,280" class="ed" marker-end="url(#f2-a)" marker-start="url(#f2-a)"/><text x="482" y="274" class="lb" text-anchor="middle">open-graph, select, stats</text><path d="M600,360 L364,360" class="ed" marker-end="url(#f2-a)" marker-start="url(#f2-a)"/><text x="482" y="354" class="lb" text-anchor="middle">procedures, def-query</text><rect x="942" y="92" width="270" height="60" rx="6" class="nd live"/><text x="952" y="112" class="t1" text-anchor="start">a slave image</text><text x="952" y="129" class="t2" text-anchor="start">a slave-graph: one thread connects,</text><text x="952" y="144" class="t2" text-anchor="start">receives, applies</text><rect x="942" y="172" width="270" height="60" rx="6" class="nd live"/><text x="952" y="192" class="t1" text-anchor="start">a peer device image</text><text x="952" y="209" class="t2" text-anchor="start">a peer-graph :device; peer-sync pulls,</text><text x="952" y="224" class="t2" text-anchor="start">then pushes</text><rect x="942" y="252" width="270" height="60" rx="6" class="nd"/><text x="952" y="272" class="t1" text-anchor="start">browser</text><text x="952" y="289" class="t2" text-anchor="start">the cockpit&#x27;s front end; relative</text><text x="952" y="304" class="t2" text-anchor="start">api/ paths, nothing from a CDN</text><rect x="942" y="332" width="270" height="60" rx="6" class="nd"/><text x="952" y="352" class="t1" text-anchor="start">HTTP client</text><text x="952" y="369" class="t2" text-anchor="start">curl, an application; username and</text><text x="952" y="384" class="t2" text-anchor="start">password as request parameters</text><path d="M942,122 L848,122" class="ed" marker-end="url(#f2-a)"/><text x="895" y="116" class="lb" text-anchor="middle">tx packets</text><path d="M942,202 L848,202" class="ed" marker-end="url(#f2-a)"/><text x="895" y="196" class="lb" text-anchor="middle">ops, acks</text><path d="M942,282 L848,282" class="ed" marker-end="url(#f2-a)"/><text x="895" y="276" class="lb" text-anchor="middle">HTTP · pages</text><path d="M942,362 L848,362" class="ed" marker-end="url(#f2-a)"/><text x="895" y="356" class="lb" text-anchor="middle">HTTP · JSON</text><path d="M44,457 L44,529 A135.0,7 0 0 0 314,529 L314,457" class="nd store"/><ellipse cx="179.0" cy="457" rx="135.0" ry="7" class="nd store"/><text x="54" y="480" class="t1" text-anchor="start">graph directories</text><text x="54" y="497" class="t2" text-anchor="start">one per open store (figure 3);</text><text x="54" y="512" class="t2" text-anchor="start">a .dirty file while open, the journal in tx/</text><path d="M340,457 L340,529 A110.0,7 0 0 0 560,529 L560,457" class="nd store"/><ellipse cx="450.0" cy="457" rx="110.0" ry="7" class="nd store"/><text x="350" y="480" class="t1" text-anchor="start">the system directory</text><text x="350" y="497" class="t2" text-anchor="start">type-registry.log, store-registry.log</text><text x="350" y="512" class="t2" text-anchor="start">edge-occupancy.dat, schema-manifest.dat</text><text x="350" y="527" class="t2" text-anchor="start">+ the clock dir: system-clock.dat, .lock</text><rect x="640" y="450" width="224" height="60" rx="6" class="nd sub"/><text x="650" y="470" class="t1" text-anchor="start">htpasswd · openssl passwd</text><text x="650" y="487" class="t2" text-anchor="start">one subprocess per REST login</text><rect x="640" y="560" width="224" height="60" rx="6" class="nd sub"/><text x="650" y="580" class="t1" text-anchor="start">dot · circo · twopi · fdp</text><text x="650" y="597" class="t2" text-anchor="start">visualize :render (algorithms-io)</text><rect x="340" y="580" width="220" height="70" rx="6" class="nd live"/><text x="350" y="600" class="t1" text-anchor="start">another graph-db image</text><text x="350" y="617" class="t2" text-anchor="start">appends to the registries under</text><text x="350" y="632" class="t2" text-anchor="start">flock; the clock lock has one owner</text><path d="M180,386 L180,450" class="ed" marker-end="url(#f2-a)"/><text x="188" y="424" class="lb" text-anchor="start">mmap, pwrite, rename</text><path d="M330,386 L330,408 L450,408 L450,450" class="ed" marker-end="url(#f2-a)"/><text x="458" y="436" class="lb" text-anchor="start">ids, epochs, under flock</text><path d="M500,580 L500,536" class="ed" marker-end="url(#f2-a)"/><text x="508" y="562" class="lb" text-anchor="start">flock</text><path d="M724,406 L724,450" class="ed" marker-end="url(#f2-a)"/><text x="732" y="434" class="lb" text-anchor="start">password on stdin</text><path d="M580,408 L580,590 L640,590" class="ed" marker-end="url(#f2-a)"/><text x="588" y="580" class="lb" text-anchor="start">DOT text</text><text x="24" y="690" class="t3" text-anchor="start">Teal: this repository&#x27;s code; heavy black: files; a dashed box is a subprocess. An arrowhead marks the side that listens; two heads, calls each way.</text></svg>
